# radiod configuration.
#
# Every key corresponds to a field in hh_radiod_config_t
# (radiod/include/hhsdr/radiod/config.h). Syntax matches the project's other
# configuration files: `key = value`, with `#` or `;` beginning a comment.
#
# Command-line options (-s, -v) override anything set here.
#
# NOTE: radiod names no OpenCPI worker, property or application itself; the
# ocpi_* keys below supply them. There are deliberately no PL, hopset or TLV
# settings: those contracts do not exist yet (see unknown.md), and
# configuration for them would amount to inventing the contract.

# Control socket to bind.
#
# The default lives in /tmp, which is world-writable -- any local user can
# connect to the control plane or squat the path. The production path and its
# access policy are an open question (unknown.md, U-10).
sock_path = /tmp/hh-radiod.sock

# Control-loop period in milliseconds. radiod blocks waiting for client
# activity up to this long, so it also bounds how often a backend with no
# client traffic is polled.
tick_interval_ms = 10

# Drop a connected client that has sent nothing for this many milliseconds.
# 0 disables the timeout, which is the historical behaviour: an idle client
# otherwise holds its slot indefinitely, and 16 of them exhaust the table.
client_idle_timeout_ms = 0

# error | warn | info | debug | trace
log_level = info

# Which backend radiod owns: mock | ocpi
#
# ocpi makes radiod the owner of an OpenCPI application (created, configured
# and started on `start`, stopped and released on `stop`). It exists only in
# builds configured with -DHH_WITH_OPENCPI=ON; any other build refuses to
# start with backend = ocpi rather than falling back to the mock.
backend = mock

# --- used only when backend = ocpi -------------------------------------------
#
# Application XML handed to the OpenCPI ACI. Required for backend = ocpi.
#ocpi_app = /opt/app/app.xml
#
# Artifact search path, exported as OCPI_LIBRARY_PATH before the application is
# created. Leave unset to use the environment radiod was started with.
#ocpi_library_path = /opt/app/artifacts
#
# Property written after initialize and before start, as
# instance.property=value. Repeat the key for more (up to 16), applied in
# file order. The value may contain '.' and '='.
#ocpi_property = src.messageSize=4096
