# HH-SDR MANET node configuration.
# Every key corresponds to a field in hh_config_t (include/hhsdr/core/config.h)
# and to an SCA PRF `configure`-kind property.
#
# Values here are this implementation's operating point, NOT specification
# values: the HW/SW Interface Specification §12 item 4 records all timer and
# threshold values as TBD pending a HW/PHY decision.

node_id         = 1
routing_capable = true
log_level       = info

# Radio adapter selection. "hw" is the FPGA/PL-backed adapter, which is
# currently a TBD stub -- see docs/HARDWARE-DEPENDENCIES.md.
radio_adapter = hw

# Discovery (Doc 1 §4)
beacon_interval_acq_ms = 200
beacon_interval_ms     = 1000
beacon_interval_min_ms = 200
beacon_interval_max_ms = 4000
acquisition_timeout_ms = 3000

# Neighbor management (Doc 1 §4)
neighbor_allowed_loss = 3
max_neighbors         = 64

# Link health (Doc 1 §7) -- recover threshold must exceed degrade (hysteresis)
lh_degrade_threshold   = 0.60
lh_recover_threshold   = 0.80
lh_suspect_hold_ms     = 2000
lh_recover_hold_ms     = 3000
lh_min_signals_suspect = 2

# Routing (Doc 1 §6)
route_active_timeout_ms  = 6000
route_delete_period_ms   = 6000
route_update_interval_ms = 1000
max_hop_count            = 16

# Recovery (Doc 1 §8)
hold_down_ms             = 2000
merge_hold_down_ms       = 4000
dampening_flap_threshold = 3
